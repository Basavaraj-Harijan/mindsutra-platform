server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mindsutra_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

mindsutra:
  jwt:
    secret: replace_with_256_bit_base64_encoded_secret_key_minimum_32_chars
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000
  ai:
    service-url: http://localhost:8000
    internal-key: ""