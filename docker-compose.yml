version: '3.9'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindsutra_db}
      MYSQL_USER: ${MYSQL_USER:-mindsutra_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindsutra_pass}
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
  ai-service:
    build: ./ai-service
    env_file: .env
    ports:
      - "8000:8000"
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - ai-service
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
